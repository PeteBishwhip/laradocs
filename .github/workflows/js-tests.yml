name: js-tests

on:
  push:
    branches: [main]
    paths:
      - 'resources/dist/laradocs.js'
      - 'resources/dist/laradocs-ai.js'
      - 'tests/js/**'
      - 'package.json'
      - '.github/workflows/js-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'resources/dist/laradocs.js'
      - 'resources/dist/laradocs-ai.js'
      - 'tests/js/**'
      - 'package.json'
      - '.github/workflows/js-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run the bundled JS tests
        run: npm test
